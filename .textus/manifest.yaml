version: textus/4
roles:
  - { name: human, can: [author, propose, ingest] }
  - { name: agent, can: [propose, keep, ingest] }
  - { name: automation, can: [converge, ingest] }
lanes:
  - { name: knowledge, kind: canon, desc: "the maintained source of truth about the repo" }
  - { name: scratchpad, kind: workspace, owner: agent, desc: "the agent's own durable scratchpad (working memory)" }
  - { name: proposals, kind: queue, desc: "changes awaiting a human accept" }
  - { name: artifacts, kind: machine, desc: "machine-maintained computed outputs" }
  - { name: raw, kind: raw, desc: "ingested external source material (write-once)" }
entries:
  - { key: knowledge.execution, lane: knowledge, schema: runbook, owner: human:self, kind: nested, nested: true }
  - { key: knowledge.intent, lane: knowledge, owner: human:self, kind: nested, nested: true }
  - { key: knowledge.constraint.repo, lane: knowledge, owner: human:self, kind: nested, nested: true }
  - { key: knowledge.judgment.engineering, lane: knowledge, owner: human:self, kind: nested, nested: true }
  - { key: knowledge.judgment.agent-behavior, lane: knowledge, owner: human:self, kind: nested, nested: true }
  - { key: knowledge.evidence, lane: knowledge, owner: human:self, kind: nested, nested: true, ignore: ["**/README.md"] }
  - { key: knowledge.feedback, lane: knowledge, owner: human:self, kind: nested, nested: true }
  - { key: artifacts.contributing, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.security, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.code-of-conduct, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.changelog, lane: artifacts, format: json, kind: produced }
  - { key: knowledge.constraint.protocol, lane: knowledge, owner: human:self, kind: nested, nested: true }
  - { key: scratchpad.notes, lane: scratchpad, owner: agent:self, kind: nested, nested: true }
  - { key: scratchpad.sessions, lane: scratchpad, owner: agent:self, kind: nested, nested: true }
  - { key: scratchpad.scripts, lane: scratchpad, owner: agent:self, kind: nested, nested: true }
  - { key: proposals.notes, lane: proposals, owner: agent:self, kind: nested, nested: true }
  - { key: raw, lane: raw, format: yaml, owner: agent:self, kind: nested, nested: true }
  - { key: artifacts.boot, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.config.opencode, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.config.mcp, lane: artifacts, path: artifacts/config/claude-mcp.json, kind: produced }
  - { key: artifacts.config.plugin, lane: artifacts, path: artifacts/config/claude-plugin.json, kind: produced }
  - { key: artifacts.decisions.log, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.docs.readme, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.architecture.index, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.design.invariants, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.how-to.agents-mcp, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.how-to.configuring-lanes, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.how-to.drain-scheduling, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.how-to.migrations, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.reference.lanes, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.reference.conventions, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.reference.testing, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.reference.engineering-skills, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.reference.contributor-conventions, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.explanation.concepts, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.doctor.rule-ambiguity, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.doctor.manifest-files, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.doctor.templates, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.doctor.schemas, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.doctor.publish-tree-overlap, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.doctor.loop-shape, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.system.index, lane: artifacts, format: json, kind: produced }
  - { key: artifacts.feeds.skills, lane: artifacts, format: json, kind: produced }
