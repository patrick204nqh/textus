version: textus/4
data:
  knowledge:
    - key: knowledge.loop.intent
      naming: sequential
    - key: knowledge.loop.constraint.repo
      naming: sequential
    - key: knowledge.loop.constraint.protocol
      naming: sequential
    - key: knowledge.loop.judgment.engineering
      naming: sequential
    - key: knowledge.loop.judgment.agent-behavior
      naming: sequential
    - key: knowledge.loop.evidence
      naming: sequential
    - key: knowledge.loop.execution
      naming: sequential
      schema: runbook
    - key: knowledge.loop.feedback
      naming: sequential
    - key: knowledge.reference
  scratchpad:
    - key: scratchpad.notes
      tracked: false
    - key: scratchpad.sessions
      tracked: false
    - key: scratchpad.scripts
      tracked: false
  proposals:
    - key: proposals.notes
  raw:
    - key: raw
      format: yaml
  artifacts:
    - { key: artifacts.contributing, format: json }
    - { key: artifacts.changelog, format: json }
    - { key: artifacts.boot, format: json }
    - { key: artifacts.config.opencode, format: json }
    - { key: artifacts.config.mcp, path: artifacts/config/claude-mcp.json }
    - { key: artifacts.config.plugin, path: artifacts/config/claude-plugin.json }
    - { key: artifacts.decisions.log, format: json }
    - { key: artifacts.docs.readme, format: json }
    - { key: artifacts.architecture.index, format: json }
    - { key: artifacts.design.invariants, format: json }
    - { key: artifacts.how-to.agents-mcp, format: json }
    - { key: artifacts.how-to.configuring-lanes, format: json }
    - { key: artifacts.how-to.drain-scheduling, format: json }
    - { key: artifacts.how-to.migrations, format: json }
    - { key: artifacts.reference.lanes, format: json }
    - key: artifacts.render.conventions
      format: json
      publish:
        - { to: docs/reference/conventions.md, template: docs/reference/conventions.erb }
    - key: artifacts.render.testing
      format: json
      publish:
        - { to: docs/reference/testing.md, template: docs/reference/testing.erb }
    - key: artifacts.render.engineering-skills
      format: json
      publish:
        - { to: docs/reference/engineering-skills.md, template: docs/reference/engineering-skills.erb }
    - key: artifacts.render.contributor-conventions
      format: json
      publish:
        - { to: docs/reference/contributor-conventions.md, template: docs/reference/contributor-conventions.erb }
    - key: artifacts.render.drain-scheduling
      format: json
      publish:
        - { to: docs/how-to/drain-scheduling.md, template: docs/how-to/drain-scheduling.erb }
    - key: artifacts.render.migrations
      format: json
      publish:
        - { to: docs/how-to/migrations.md, template: docs/how-to/migrations.erb }
    - key: artifacts.render.code-of-conduct
      format: json
      publish:
        - { to: CODE_OF_CONDUCT.md, template: docs/meta/code-of-conduct.erb }
    - key: artifacts.render.security
      format: json
      publish:
        - { to: SECURITY.md, template: docs/meta/security.erb }
    - { key: artifacts.explanation.concepts, format: json }
    - { key: artifacts.doctor.rule-ambiguity, format: json }
    - { key: artifacts.doctor.manifest-files, format: json }
    - { key: artifacts.doctor.protocol-version, format: json }
    - { key: artifacts.doctor.schema-parse-error, format: json }
    - { key: artifacts.doctor.illegal-keys, format: json }
    - { key: artifacts.doctor.sentinels, format: json }
    - { key: artifacts.doctor.audit-log, format: json }
    - { key: artifacts.doctor.unowned-schema-fields, format: json }
    - { key: artifacts.doctor.schema-violations, format: json }
    - { key: artifacts.doctor.orphaned-publish-targets, format: json }
    - { key: artifacts.doctor.proposal-targets, format: json }
    - { key: artifacts.doctor.generator-drift, format: json }
    - { key: artifacts.doctor.raw-asset-paths, format: json }
    - { key: artifacts.doctor.scratchpad-sources, format: json }
    - { key: artifacts.doctor.stale-reviewed-stamp, format: json }
    - { key: artifacts.doctor.cursor-retention, format: json }
    - { key: artifacts.doctor.templates, format: json }
    - { key: artifacts.doctor.schemas, format: json }
    - { key: artifacts.doctor.publish-tree-overlap, format: json }
    - { key: artifacts.doctor.loop-shape, format: json }
    - { key: artifacts.doctor.naming-check, format: json }
    - { key: artifacts.system.index, format: json }
    - { key: artifacts.feeds.skills, format: json }
